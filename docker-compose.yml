services:
  webhook:
    build: .
    image: webhook-sequencer:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_PATH: /data/webhooks.db
      # Delivery / retry tuning (defaults shown):
      MAX_ATTEMPTS: "5"
      RETRY_BASE_DELAY_SECONDS: "1"
      RETRY_MAX_DELAY_SECONDS: "300"
      DELIVERY_TIMEOUT_SECONDS: "10"
      DISPATCH_INTERVAL_SECONDS: "0.2"
      DISPATCH_CONCURRENCY: "16"
    volumes:
      - webhook-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3))['status']=='ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  webhook-data:
